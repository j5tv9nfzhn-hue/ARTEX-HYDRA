services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 文件中必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: autumn27/artex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # 首启保护：空配置时在启动日志打印随机设置令牌。
      # /setup 必须输入该值才能创建管理员密码，可用 docker compose logs artex 查看。
      # ARTEX_ADMIN_PASSWORD 可跳过 /setup 直接初始化，至少八个字符。
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # 浏览器 CORS 允许列表以逗号分隔，内嵌 UI 同源，通常无需填写。
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # 服务端默认输出语言为 zh，支持 en、es，旧 ko 归一为 zh。
      # 设置页的输出语言优先于默认值；控制台日志只遵循 ARTEX_LANG 或文件配置。
      ARTEX_LANG: ${ARTEX_LANG:-}
    ports:
      # 默认仅发布到宿主 127.0.0.1，需要其他设备直连时可设置 ARTEX_BIND=0.0.0.0。
      # 绑定公网或其他设备前必须完成管理员初始化。
      # 尽量使用 README 中的 HTTPS 反向代理配置。
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 将含 SQLite、jwt.key 等的数据目录挂载到项目根 data。
      # 便于宿主查看、备份，重建容器不会删除持久化数据。
      - ./data:/app/data
      # 将宿主 skills 挂载到容器，覆盖镜像内 /app/skills。
      # 修改 Skill 无需重新构建镜像，容器直接读取宿主文件。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
