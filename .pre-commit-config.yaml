# pre-commit 配置示例，文档：https://pre-commit.com
#
# 在本地提交前执行确定性的 CI 合并门禁。
# 任意断言失败即返回非零，阻止提交。
# 开发者无需等到 push 后才发现损坏的引用或规则。
#
# 1) detections：规则、指标来源或防御内联 Sigma 模板变化时执行。
# docs/defense-{ko,en}.md 的主体模板也属于检查范围。
# run-all.sh 执行八类规则测试与三个其他门禁。
# 来源范围与 .github/workflows/detections.yml 一致。
# 规则改动必须同步样本、测试与层；文档模板改动必须同步已测承诺。
# 规则检查需要 Docker，各测试在容器内隔离执行。
# runner 本身不安装额外测试工具。
# 2) docs：检查已跟踪 Markdown 的内部文件、图片与标题锚点。
# 使用 check-doc-links.py，与 docs.yml 相同。
# always_run 不缩小文件范围，防止忽略非 Markdown 的目标变化。
# 删除或移动被引用的图片、LICENSE 等也可能破坏链接。
# 仅使用 Python 标准库，不访问网络。
# 不需要 Docker，可快速完成本地检查。
#
# 安装：pip install pre-commit && pre-commit install
# 手工运行：pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# 可按需追加 Go、Web 检查；语言残留门禁已在下方提供。
repos:
  - repo: local
    hooks:
      - id: detections
        name: 八类检测规则测试（Sigma、Suricata、ATT&CK、指标、MISP）
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: 文档内部链接、图片与标题锚点检查
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
      - id: language
        name: 项目自有文本的韩文残留检查
        entry: python3 -I scripts/check-language.py --source
        language: system
        pass_filenames: false
        always_run: true
