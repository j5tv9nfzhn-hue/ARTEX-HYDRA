name: web
# 每次相关 push、PR 构建中文 UI 静态导出，发现前端回归。
# release.yml 仅在 v* tag 构建发布包，不能代替日常验证。
# 本工作流负责 TypeScript、React、i18n、next-intl 的常规改动。
# Go 构建和测试由 ci.yml 负责。
# paths 覆盖 web 与相应语言检查脚本。
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/actions/node-build-cache/**"
      - "scripts/check-language.py"
      - "scripts/check-web-cjk.py"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/actions/node-build-cache/**"
      - "scripts/check-language.py"
      - "scripts/check-web-cjk.py"

permissions:
  contents: read

# 新提交取消旧提交，避免同一 PR 连续推送时多个构建争抢同一份缓存。
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态构建是合并门禁，NEXT_EXPORT=1 next build 同时执行类型检查。
  # 不开启 typescript.ignoreBuildErrors，类型错误不能被跳过。
  # 任何类型检查或静态导出失败均阻止合并。
  #
  # Biome 检查也是合并门禁，保持既有错误数为零。
  # 既有可访问性、package.json 与 SVG 标题错误已在原分支清理。
  # npm run check 发现 error 时必须失败，而非仅作为参考。
  # 防止 lint、format、a11y 回归被再次引入。
  # 原有 warning、info 不改变退出码，只有 error 阻止合并。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # 缓存由 node-build-cache 复合动作统一管理，与 release.yml 共享同一份 key
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: ./.github/actions/node-build-cache
        with:
          working-directory: web
      - name: npm ci
        run: npm ci
      - name: 前端单元测试（含语言迁移和审批摘要）
        run: npm test
      - name: build:static（合并门禁，含类型检查）
        run: npm run build:static
      - name: 静态 UI 无韩文残留
        run: python3 -I ../scripts/check-language.py --web
      - name: 上传静态导出产物
        uses: actions/upload-artifact@v7
        with:
          name: web-out-ci
          path: out/
          retention-days: 14
          if-no-files-found: error
      - name: biome check（lint、format、a11y 错误为零）
        if: always()
        run: npm run check