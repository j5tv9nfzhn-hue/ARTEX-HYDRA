name: mobile

# 手机端（Expo / React Native）的云上校验。
# 仓库铁律：不在本机构建，所有验证都交给 Actions。
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 首轮软门禁：Expo SDK 与 RN 的版本号由这里实际解析得到，
      # 等 ci 绿过一次后把 continue-on-error 去掉、并提交生成的 lock 文件。
      - name: install
        run: npm install --no-audit --no-fund --no-package-lock

      - name: typecheck
        run: npx tsc --noEmit

      - name: summary
        if: always()
        run: |
          echo "### mobile 校验" >> "$GITHUB_STEP_SUMMARY"
          echo "- 安装与类型检查本轮为软门禁（continue-on-error），用于确认依赖可解析。" >> "$GITHUB_STEP_SUMMARY"
