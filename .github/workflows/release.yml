name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 所需权限

jobs:
  # ① 前端静态导出仅执行一次，供各平台目标复用。
  frontend:
    runs-on: ubuntu-latest
    steps:
      # 客户端只认 vX.Y.Z：带 -rc.1 / -ko.1 之类后缀的 tag 会被 parseVersion 判成
      # 不可比较，所有客户端的一键更新会静默禁用。宁可在这一步失败，也不要发出
      # 一个没人能自动升级的版本。
      - name: 校验 tag 必须是 vX.Y.Z
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 vX.Y.Z（三段式），当前为 $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/out

  # ② 三端交叉编译（linux/darwin/windows × amd64/arm64），内嵌前端并打包 zip。
  # 发布三端 zip 包，不发布 Docker 镜像。
  #
  # 缓存策略：模块缓存与平台无关，各 matrix 分支共用一份；
  # 编译缓存按 goos+goarch 区分，避免不同目标的产物互相污染。
  # cache-mode: read —— 该 job 持有构建产物，限定只读缓存，防止低信任来源写入的
  # 缓存条目污染发布构建（2026-06 起 GitHub 对高权限 job 的缓存隔离机制）。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    cache-mode: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-
            gomod-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          # 更新源在构建期写死为本仓库：fork 出来的构建不会去连上游仓库。
          ARTEX_UPDATE_REPO: ${{ github.repository }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # Release 优先可移植性：Go linker 去符号 + zip 压缩，不用 UPX。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      # runner 不执行非宿主平台的二进制；用 scripts/check-binary-headers.py
      # 校验可执行文件头与目标架构（PE/ELF/Mach-O 的魔数与机器类型）代替冒烟测试。
      - name: 校验可执行文件头与目标架构
        run: python3 -I scripts/check-binary-headers.py "${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"

  # ③ 汇总 zip 并创建 GitHub Release。
  # cache-mode: none —— 该 job 持有发布凭据，不从任何缓存恢复内容，
  # 杜绝被污染的缓存条目影响对外发布的产物（GitHub 2026-06 起的缓存隔离机制）。
  release:
    needs: binaries
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      # 只用仓库里的 scripts/gen-update-manifest.py，不执行任何构建产物。
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
      # latest.json 必须等 Release 建好之后再生：它的 body 就是 GitHub 生成的
      # 发布说明，published_at / html_url 也来自这条 Release。
      #
      # 这个文件是客户端日常检测的入口
      # （https://github.com/<repo>/releases/latest/download/latest.json），
      # 走网页别名不计 API 配额；缺失时客户端会回落到 REST API（60 次/小时/IP）。
      # 所以它上传失败不会让更新不可用，只是把额度压力还回去——仍然要让整条流水线红掉。
      - name: 生成并上传更新清单 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > dist/notes.md
          PUBLISHED_AT=$(gh release view "$GITHUB_REF_NAME" --json publishedAt --jq .publishedAt)
          python3 scripts/gen-update-manifest.py \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --notes dist/notes.md \
            --published-at "$PUBLISHED_AT" \
            --out dist/latest.json
          gh release upload "$GITHUB_REF_NAME" dist/latest.json --clobber