name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 所需权限

jobs:
  # ① 前端静态导出仅执行一次，供各平台交叉编译复用。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/out

  # ② 五个平台交叉编译，内嵌前端并打包 zip。
  #
  # 缓存策略：模块缓存（GOMODCACHE）与平台无关，五个 matrix 分支共用一份；
  # 编译缓存（GOCACHE）按 goos/goarch 区分，避免交叉编译互相污染产物。
  # cache-mode: read —— 该 job 持有构建产物，限定只读缓存，防止低信任来源写入的
  # 缓存条目污染发布构建（2026-06 起 GitHub 对高权限 job 的缓存隔离机制）。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    cache-mode: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # 编译缓存按目标平台区分，避免交叉编译互相污染产物；
          # 模块缓存与平台无关，但此处同 key 也能直接命中 ci.yml 写入的条目。
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-
            gomod-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化或安全政策下可能崩溃。
          # Release 优先可移植性，使用 Go linker 去符号与 zip 压缩。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # 单独上传 Linux 二进制供 Docker job 复用，避免镜像内再次编译前后端。
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 汇总 zip 并创建 GitHub Release。
  # cache-mode: none —— 该 job 持有发布凭据，不从任何缓存恢复内容，
  # 杜绝被污染的缓存条目影响对外发布的产物（GitHub 2026-06 起的缓存隔离机制）。
  release:
    needs: binaries
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # ④-0 发布凭据门禁：仅设置 Docker Hub secrets 时才执行 Docker job。
  # 无凭据则跳过镜像发布，二进制 Release 正常完成。
  # job 级 if 无法直接读取 secrets，因此先输出凭据是否存在。
  # docker job 再根据该输出决定是否执行。
  # 发布命名空间需由维护者另行确定，不能推送到上游占位命名空间。
  # 开启发布前必须修改 namespace，否则 guard 在构建前中止。
  # 详见 docker job 的 IMAGE_NAMESPACE 注释。
  docker-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: 检查 Docker Hub 发布凭据
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未设置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN，跳过 Docker 镜像发布；二进制 Release 正常进行。"
          fi

  # ④ 多架构 Docker 镜像发布，复用 binaries job 的 Linux 二进制。
  # 镜像仅安装工具与放入二进制，arm64 只需模拟 apt 层。
  docker:
    needs: [binaries, docker-gate]
    if: needs.docker-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      # ⚠️ 发布 namespace 的默认值属于上游 Autumn-27，仅为占位。
      # 本分支没有向该 namespace 推送的权限，不能默认沿用它发布。
      # 设置 Docker Hub secrets、开启发布前，必须改为自己拥有的 namespace。
      # 例如自己的 Docker Hub 仓库，或另行配置有权限的 GHCR 仓库。
      # 仓库名称与注册表配置由维护者决定，本次语言重构不擅自启用发布。
      # 未修改 namespace 时 guard 会在构建之前停止。
      # 避免最后 push 才出现令人困惑的 denied。
      IMAGE_NAMESPACE: autumn27/artex
    steps:
      # docker/login 成功不意味着对目标 namespace 有发布权限。
      # 原占位 namespace 属于其他账户，build-push 最后才失败太晚。
      # 在这里预先拒绝未配置的 namespace。
      # 此门禁只判断占位值未修改，不替维护者选择发布地址。
      # 发布权限和命名空间配置不属于语言切换逻辑。
      - name: 检查发布命名空间仍为上游占位值（提前中止）
        run: |
          if [ "${IMAGE_NAMESPACE}" = "autumn27/artex" ]; then
            echo "::error::IMAGE_NAMESPACE 仍是上游占位值 'autumn27/artex'，本分支没有推送权限。请先将 release.yml 中 docker job 的 IMAGE_NAMESPACE 改为自己拥有的 Docker Hub 仓库，并配置相应发布凭据，再重新发布 tag。"
            exit 1
          fi
      - uses: actions/checkout@v7 # 获取 Dockerfile 与 skills
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
