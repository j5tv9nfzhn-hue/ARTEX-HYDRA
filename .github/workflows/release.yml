name: release

# 唯一的构建与发布工作流。
#
# 2026-10-21 之前 ci.yml 与 release.yml 各有一套前端构建与 Go 编译：ci 每次 push 都跑
# 「前端静态导出 → go build → build.sh --release → 传 artifact」，release 在 tag 上把
# 同样的事再做一遍。两套构建 = 两处维护、两套缓存 key，还会出现「ci 绿了但 release 挂了」。
# 现在只保留这一份：
#
#   gate      编译与静态检查（硬门禁：编不过就不发）
#   frontend  前端静态导出，产物给 binaries 复用（硬门禁：前端编不过就不发）
#   binaries  六目标交叉编译与打包（硬门禁）
#   desktop   Wails V2 桌面端三平台原生构建与打包（硬门禁：CGO 无法交叉编译）
#   release   建草稿 → 传资产 → 校验齐全 → 转正（失败即删草稿）
#   signals   测试 / 语言 / 文档链接：只报告，不拦发布
#
# 检测规则仍由独立的 detections.yml 按路径触发——它不产出二进制，
# 与本工作流没有重复构建。
#
# 触发方式：
#   push tag vX.Y.Z   完整流水线并发布
#   workflow_dispatch 干跑（不发布），用于打 tag 前确认能编过
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 建草稿、传资产、公开 Release

jobs:
  # ⓪ 编译与静态检查：确定性失败必须拦住。
  #
  # 这里只放「产物一定不可用」的判断：编不过、vet 不过、格式不过、lint 不过。
  # 测试不放这里（见 signals）：测试红通常说明源码健康度，不说明二进制坏掉。
  gate:
    runs-on: ubuntu-latest
    steps:
      # 客户端只认 vX.Y.Z 或 vX.Y.Z.W：带 -rc.1 / -ko.1 之类后缀的 tag 会被
      # parseVersion 判成不可比较，所有客户端的一键更新会静默禁用。宁可在这一步
      # 失败，也不要发出一个没人能自动升级的版本。
      #
      # 第四段是「同一个 patch 重发的微修订」（2.4.0 → 2.4.0.1），只在需要重发
      # 修好的同版本产物时使用，不替代正常的 patch 递增。
      - name: 校验 tag 必须是 vX.Y.Z 或 vX.Y.Z.W
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::tag 必须是 vX.Y.Z 或 vX.Y.Z.W，当前为 $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: go build（编不过就不发）
        run: go build ./...
      - name: go vet（静态检查不过就不发）
        run: go vet ./...

      # 内嵌前端路径只在 -tags embedui 下参与编译，默认构建覆盖不到；
      # 单独 vet 一次，避免 embedui 分支长期不构建而悄悄腐化。
      #
      # 注意：//go:embed all:webui/dist 要求该目录**在编译时存在**，而 gate 不构建前端
      # （前端产物由 frontend job 产出后交给 binaries）。所以这里放一个占位页满足
      # embed 模式即可——本步只验证 embedui 分支能否编译，不验证真实前端内容。
      - name: go vet（含内嵌前端）
        run: |
          mkdir -p server/webui/dist
          if [ ! -f server/webui/dist/index.html ]; then
            printf '<!doctype html><title>embed-check</title>\n' > server/webui/dist/index.html
          fi
          go vet -tags embedui ./server/

      # 格式门禁：gofmt -l 输出任何文件即失败；失败时连 diff 一起打出来。
      # 为什么要打 diff：本机受限环境不许跑 gofmt（见 AGENTS.md），只给文件名时
      # 只能靠猜着改、一轮 CI 试一次；有了 diff 就能照着改一遍到位。
      - name: gofmt 门禁
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt（请运行 gofmt -w <文件>）："
            echo "$unformatted"
            echo ""
            echo "===== gofmt -d（最多 200 行）====="
            gofmt -d . | head -200
            exit 1
          fi

      # 静态检查门禁：配置见 .golangci.yml。
      # 格式不在此重复：golangci-lint 内嵌的 gofmt 使用其构建时的 Go 版本
      # （v2.14.0 = go1.27），与上面 Go 1.26 的 gofmt 可能判定相反，
      # 格式的唯一权威是上一步的「gofmt 门禁」。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  # ① 前端静态导出仅执行一次，供各平台目标复用。
  frontend:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - run: npm ci
        working-directory: web
      # 下面两步是信号灯：继续用 continue-on-error，红了看得见但不挡发布包。
      - name: 前端单元测试（信号）
        continue-on-error: true
        run: npm test
        working-directory: web
      - name: biome check（信号）
        continue-on-error: true
        run: npm run check
        working-directory: web
      # 这一步是硬门禁：类型检查与静态导出都在里面，前端编不过就没有可发布的包。
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/out

  # ② 三端交叉编译（linux/darwin/windows × amd64/arm64），内嵌前端并打包 zip。
  # 发布三端 zip 包，不发布 Docker 镜像。
  #
  # 缓存策略：模块缓存与平台无关，各 matrix 分支共用一份；
  # 编译缓存按 goos+goarch 区分，避免不同目标的产物互相污染。
  # cache-mode: read —— 该 job 持有构建产物，限定只读缓存，防止低信任来源写入的
  # 缓存条目污染发布构建（2026-06 起 GitHub 对高权限 job 的缓存隔离机制）。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    cache-mode: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-
            gomod-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          # 更新源在构建期写死为本仓库：fork 出来的构建不会去连上游仓库。
          ARTEX_UPDATE_REPO: ${{ github.repository }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # Release 优先可移植性：Go linker 去符号 + zip 压缩，不用 UPX。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      # runner 不执行非宿主平台的二进制；用 scripts/check-binary-headers.py
      # 校验可执行文件头与目标架构（PE/ELF/Mach-O 的魔数与机器类型）代替冒烟测试。
      - name: 校验可执行文件头与目标架构
        run: python3 -I scripts/check-binary-headers.py "${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"

  # ②b Wails V2 桌面端（artex-hydra）：CGO 依赖平台原生 webview 库
  # （Windows=WebView2、macOS=WebKit、Linux=webkit2gtk），无法交叉编译——
  # 三平台各自在原生 runner 上构建并打包（Windows/Linux 为 zip，macOS 为 .app bundle）。
  #
  # 独立 Go 模块 desktop/ 通过 replace 复用根模块后端；资产名 artex-hydra /
  # artex-hydra-core 经 build.sh 的 ldflags 注入 selfupdate，更新协议原样复用。
  desktop:
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, runner: windows-latest }
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Linux 桌面运行时依赖（webkit2gtk 等）
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libayatana-appindicator3-dev build-essential
      - name: 恢复桌面端 Go 模块缓存与 go.mod/go.sum
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            desktop/go.mod
            desktop/go.sum
          key: desktop-gomod-${{ hashFiles('desktop/go.mod') }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            desktop-gomod-
      - name: 恢复桌面端编译缓存（Linux/macOS）
        if: matrix.goos != 'windows'
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: desktop-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('desktop/go.mod') }}
          restore-keys: |
            desktop-build-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: 恢复桌面端编译缓存（Windows）
        # Windows 的 GOCACHE 在 %LocalAppData%\go-build，不是 ~/.cache/go-build。
        if: matrix.goos == 'windows'
        uses: actions/cache@v6
        with:
          path: '%LocalAppData%\go-build'
          key: desktop-build-windows-${{ matrix.goarch }}-${{ hashFiles('desktop/go.mod') }}
          restore-keys: |
            desktop-build-windows-${{ matrix.goarch }}-
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Windows 桌面端构建前置（rsrc 图标资源）
        # rsrc 把品牌 .ico + DPI manifest 编译成 .syso，go build 自动链接出带图标的 exe。
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          # -o 必须显式给：省略时 rsrc 把 .syso 写到工作目录（仓库根），
          # 而 go build 只链接 desktop/ 包目录下的 .syso，`desktop/*.syso`
          # 会找不到文件、步骤以退出码 2 结束。文件名带 _windows_<arch>
          # 后缀，go build 才会只在 windows/<arch> 目标下把它链进来。
          rsrc -ico desktop/assets/artex-hydra.ico \
            -manifest desktop/assets/app.manifest \
            -arch "${{ matrix.goarch }}" \
            -o "desktop/rsrc_windows_${{ matrix.goarch }}.syso"
          ls -la desktop/*.syso
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/webui/dist
      - name: gofmt 门禁（桌面模块独立于根模块的 golangci-lint 覆盖）
        # windows-latest 的 run 默认走 PowerShell：bash 语法必须显式指定 shell。
        shell: bash
        run: |
          unformatted="$(gofmt -l desktop/)"
          if [ -n "$unformatted" ]; then
            echo "以下桌面端文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - name: Build and package desktop with build.sh
        shell: bash
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          # 更新源在构建期写死为本仓库：fork 出来的构建不会去连上游仓库。
          ARTEX_UPDATE_REPO: ${{ github.repository }}
          ARTEX_SKIP_FRONTEND: "1"
          # CGO 二进制不做 UPX：Release 优先可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --desktop
      - name: 留档 desktop 模块 go.mod/go.sum（build.sh 内 go mod tidy 生成，不入库；仅便于核对依赖变化）
        uses: actions/upload-artifact@v7
        with:
          name: desktop-gomod-files
          path: |
            desktop/go.mod
            desktop/go.sum
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip

  # ③ 汇总 zip → 建草稿 → 传全部资产 → 校验数量 → 最后一步才公开。
  #
  # 为什么要草稿：旧流程是「先建已发布的 Release，再补 latest.json」。只要补清单那步
  # 失败，/releases/latest 就会指向一个缺清单的发布——客户端自动检测立刻退化成
  # 60 次/小时/IP 的 REST 轮询，而外部看到的却是「已经发了一个不完整的包」。
  # 草稿期间外部不可见；任何一步失败就删掉草稿（tag 保留），绝不对外留下半成品。
  release:
    needs: [binaries, desktop]
    # 干跑（workflow_dispatch）只验证能编过，不碰 Release。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      # 发布说明要从「上一个 tag」累计变更，必须有完整历史与 tag；
      # 默认 fetch-depth: 1 拿不到任何 tag，会退化成「首个版本」。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: 校验 6 个平台产物齐全
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            f="artex-rea-${version}-${t%%/*}-${t##*/}.zip"
            if [ -f "$f" ]; then echo "✓ $f"; else echo "::error::缺少 $f"; missing=1; fi
          done
          # 桌面端三平台（Windows/macOS/Linux 各一档）
          for t in windows/amd64 darwin/arm64 linux/amd64; do
            f="artex-hydra-${version}-${t%%/*}-${t##*/}.zip"
            if [ -f "$f" ]; then echo "✓ $f"; else echo "::error::缺少 $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - name: 生成发布说明（完整变更）
        # 不用 --generate-notes：它只汇总 PR 标题，本仓库大量改动是直接提交，
        # 自动生成的结果常常只剩两三条（v2.2.0 首发即如此），等于没写。
        run: |
          set -euo pipefail
          python3 -I scripts/gen-release-notes.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --dist dist \
            --out dist/RELEASE_NOTES.md

      - name: 建草稿发布（此时对外不可见）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "已存在同名草稿/发布，按当前历史刷新说明"
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag \
              --title "ARTEX-HYDRA ${GITHUB_REF_NAME}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
      - name: 上传 zip 与校验和
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
      - name: 生成并上传 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > dist/notes.md
          # 草稿没有 publishedAt，用当前时间补：该字段只用于界面展示。
          python3 scripts/gen-update-manifest.py \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --notes dist/notes.md \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out dist/latest.json
          gh release upload "$GITHUB_REF_NAME" dist/latest.json --clobber
      - name: 校验资产齐全后才公开
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > dist/uploaded.txt
          {
            for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              echo "artex-rea-${version}-${t%%/*}-${t##*/}.zip"
            done
            for t in windows/amd64 darwin/arm64 linux/amd64; do
              echo "artex-hydra-${version}-${t%%/*}-${t##*/}.zip"
            done
            echo SHA256SUMS
            echo latest.json
          } | sort > dist/expected.txt
          if ! diff -u dist/expected.txt dist/uploaded.txt; then
            echo "::error::资产与预期不一致，拒绝公开。"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - name: 失败则删除草稿（tag 保留）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          echo "已清掉草稿；tag $GITHUB_REF_NAME 保留，修好后重跑本 workflow 即可。"

  # ④ 信号灯：测试、语言、文档链接。
  # 放在独立 job 并 continue-on-error：红的 job 在界面上依然显眼，
  # 但不影响本次运行成败，也不影响前面已经产出并发布的包——「测试红 ≠ 产物坏」。
  signals:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # 各包 TestMain 各自指向自己的临时 SQLite 库，不依赖任何外部服务。
      - name: go test（全量真实执行；红了只是信号）
        run: go test ./... -count=1 -timeout 600s
      - name: 语言检查（源码、注释、词库与文档无韩文残留）
        if: always()
        run: python3 -I scripts/check-language.py --source
      - name: 文档内部链接、图片与锚点
        if: always()
        run: python3 -I scripts/check-doc-links.py
      - name: 启动脚本未被写坏（编码/换行/首行/chcp 位置）
        if: always()
        run: python3 -I scripts/check-start-scripts.py
