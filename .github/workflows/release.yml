name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 建草稿、传资产、公开 Release

jobs:
  # ⓪ 发布门禁：只拦「编不过」，不拦测试断言。
  #
  # 为什么不直接等 ci.yml 全绿：ci 的 go job 里混着两类东西——
  #   1) 真实的集成测试（数据库、通知投递、引擎）：红了通常就是真坏了；
  #   2) 快照类断言（capability golden / 档位计数 / manifest 形状）：红了只说明
  #      「改了工具面没同步快照」，二进制与发布包本身照常可用。
  # 用 2) 去拦发布，会把一个能跑的新版本卡在门外；而 1) 的价值在于「早发现」，
  # 不在于「拦住发版」——真要拦，也该是人工判断，不是自动化一刀切。
  # 所以门禁只做最保守、最没有歧义的一件事：编不过 / 静态检查不过就别发。
  # 测试仍在 ci.yml 里全量跑，红了看得见，只是不再决定「能不能发」。
  gate:
    runs-on: ubuntu-latest
    steps:
      # 客户端只认 vX.Y.Z：带 -rc.1 / -ko.1 之类后缀的 tag 会被 parseVersion 判成
      # 不可比较，所有客户端的一键更新会静默禁用。宁可在这一步失败，也不要发出
      # 一个没人能自动升级的版本。
      - name: 校验 tag 必须是 vX.Y.Z
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 vX.Y.Z（三段式），当前为 $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: go build（编不过就不发）
        run: go build ./...
      - name: go vet（静态检查不过就不发）
        run: go vet ./...

  # ① 前端静态导出仅执行一次，供各平台目标复用。
  frontend:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/out

  # ② 三端交叉编译（linux/darwin/windows × amd64/arm64），内嵌前端并打包 zip。
  # 发布三端 zip 包，不发布 Docker 镜像。
  #
  # 缓存策略：模块缓存与平台无关，各 matrix 分支共用一份；
  # 编译缓存按 goos+goarch 区分，避免不同目标的产物互相污染。
  # cache-mode: read —— 该 job 持有构建产物，限定只读缓存，防止低信任来源写入的
  # 缓存条目污染发布构建（2026-06 起 GitHub 对高权限 job 的缓存隔离机制）。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    cache-mode: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-release-
            gomod-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          # 更新源在构建期写死为本仓库：fork 出来的构建不会去连上游仓库。
          ARTEX_UPDATE_REPO: ${{ github.repository }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # Release 优先可移植性：Go linker 去符号 + zip 压缩，不用 UPX。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      # runner 不执行非宿主平台的二进制；用 scripts/check-binary-headers.py
      # 校验可执行文件头与目标架构（PE/ELF/Mach-O 的魔数与机器类型）代替冒烟测试。
      - name: 校验可执行文件头与目标架构
        run: python3 -I scripts/check-binary-headers.py "${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"

  # ③ 汇总 zip → 建草稿 → 传全部资产 → 校验数量 → 最后一步才公开。
  #
  # 为什么要草稿：旧流程是「先建已发布的 Release，再补 latest.json」。只要补清单那步
  # 失败，/releases/latest 就会指向一个缺清单的发布——客户端自动检测立刻退化成
  # 60 次/小时/IP 的 REST 轮询，而外部看到的却是「已经发了一个不完整的包」。
  # 草稿期间外部不可见；任何一步失败就删掉草稿（tag 保留），绝不对外留下半成品。
  release:
    needs: binaries
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: 校验 6 个平台产物齐全
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            f="artex-rea-${version}-${t%%/*}-${t##*/}.zip"
            if [ -f "$f" ]; then echo "✓ $f"; else echo "::error::缺少 $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - name: 建草稿发布（此时对外不可见）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "已存在同名草稿/发布，复用"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag \
              --title "ARTEX-REA ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
      - name: 上传 zip 与校验和
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
      - name: 生成并上传 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > dist/notes.md
          # 草稿没有 publishedAt，用当前时间补：该字段只用于界面展示。
          python3 scripts/gen-update-manifest.py \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --notes dist/notes.md \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out dist/latest.json
          gh release upload "$GITHUB_REF_NAME" dist/latest.json --clobber
      - name: 校验资产齐全后才公开
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > dist/uploaded.txt
          {
            for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              echo "artex-rea-${version}-${t%%/*}-${t##*/}.zip"
            done
            echo SHA256SUMS
            echo latest.json
          } | sort > dist/expected.txt
          if ! diff -u dist/expected.txt dist/uploaded.txt; then
            echo "::error::资产与预期不一致，拒绝公开。"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - name: 失败则删除草稿（tag 保留）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          echo "已清掉草稿；tag $GITHUB_REF_NAME 保留，修好后重跑本 workflow 即可。"
