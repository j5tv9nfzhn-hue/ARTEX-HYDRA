name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 所需权限

jobs:
  # ① 前端静态导出仅执行一次，供各 Windows 目标复用。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/out

  # ② Windows 交叉编译，内嵌前端并打包 zip。
  # 本项目只发布 Windows 可执行程序，不再构建 linux/darwin 目标，
  # 也不再发布 Docker 镜像。
  #
  # 缓存策略：模块缓存与平台无关，两个 matrix 分支共用一份；
  # 编译缓存按 goarch 区分，避免 amd64/arm64 产物互相污染。
  # cache-mode: read —— 该 job 持有构建产物，限定只读缓存，防止低信任来源写入的
  # 缓存条目污染发布构建（2026-06 起 GitHub 对高权限 job 的缓存隔离机制）。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    cache-mode: read
    strategy:
      matrix:
        include:
          - { goarch: amd64 }
          - { goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-windows-${{ matrix.goarch }}-release-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-windows-${{ matrix.goarch }}-release-
            gomod-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: windows
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # Release 优先可移植性：Go linker 去符号 + zip 压缩，不用 UPX。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "windows/${ARTEX_TARGET_ARCH}"
      # Linux runner 无法执行 Windows PE，改用结构校验代替冒烟测试：
      # 确认 MZ 头、PE 签名与目标机器类型（0x8664=AMD64，0xAA64=ARM64）。
      - name: 校验 PE 结构与目标架构
        run: |
          python3 - "$PWD/dist/artex-windows-${{ matrix.goarch }}/artex.exe" "${{ matrix.goarch }}" <<'PY'
          import struct, sys
          path, arch = sys.argv[1], sys.argv[2]
          data = open(path, "rb").read()
          if data[:2] != b"MZ":
              sys.exit("不是 Windows PE（缺少 MZ 头）")
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          if data[pe:pe + 4] != b"PE\0\0":
              sys.exit("缺少 PE\\0\\0 签名")
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          want = {"amd64": 0x8664, "arm64": 0xAA64}[arch]
          if machine != want:
              sys.exit(f"机器类型 0x{machine:X} 与目标 {arch} (0x{want:X}) 不符")
          print(f"PE 校验通过：{path} machine=0x{machine:X} ({arch})")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows-${{ matrix.goarch }}
          path: "dist/*.zip"

  # ③ 汇总 zip 并创建 GitHub Release。
  # cache-mode: none —— 该 job 持有发布凭据，不从任何缓存恢复内容，
  # 杜绝被污染的缓存条目影响对外发布的产物（GitHub 2026-06 起的缓存隔离机制）。
  release:
    needs: binaries
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true