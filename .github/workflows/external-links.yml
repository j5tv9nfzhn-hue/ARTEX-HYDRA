name: external-links
# 周期检查 Markdown 引用的外部链接，如事故报告机构与标准资料。
# 包括 boho.or.kr、privacy.go.kr、pipc.go.kr、fsec.or.kr 与 OWASP 等。
# 外部 URL 是否存活依赖网络和服务器政策，可能短暂失败。
# 因此不放入 docs.yml 的内部链接合并门禁。
# 仅按周调度或手动运行，不阻止 PR 合并。
# 远端链接失效时标记周期任务失败，供维护者核查。
# 内部链接、Go、检测规则、中文 UI 分别由对应工作流负责。
#
# strict 仅在允许列表之外出现 DOWN 时失败。
# 404、410、持续 5xx、DNS 或连接错误视为 DOWN。
# RESTRICTED 的主机仍存活；ALLOWED 是无法修复的上游既有失效链接。
# 两者均不导致失败，失败只提示新出现的非例外失效链接。
# 定时任务仅在默认分支 main 运行。
on:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # runner 已提供 python3，脚本仅使用标准库，无需安装依赖。
      # 使用 -I 隔离用户 site-packages 与环境。
      - name: 外部链接状态（浏览器 UA、GET、重定向、允许列表，不阻止合并）
        run: python3 -I scripts/check-external-links.py --strict
