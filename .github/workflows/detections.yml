name: detections
# Sigma、Suricata、ATT&CK 改动须验证规则实际触发、后端转换与覆盖率一致性。
# 同时检查指标与上游源码一致，及 SigmaHQ 全部约定验证器。
# 仅修改规则却未同步测试或层文件，会在此工作流失败。
# 本工作流执行 CONTRIBUTING 与检测测试文档规定的贡献契约。
# 八类测试机械验证规则、后端、样本与指标的关系。
# Go 构建、静态检查与单元测试由 release.yml 负责。
# 除八类规则测试外，还包含三个非规则合并门禁。
# 分别为 harness 注册表同步、主机 triage 自测与防御模板检查。
# 防御文档 docs/04-防御与检测.md 中的内联 Sigma 模板也需验证。
# run-all.sh 同样执行这三类检查，与规则测试分离。
# 模板门禁复现 sigma check 和 splunk、eql、loki 转换支持。
# lucene、kusto 不支持相应关联转换，两个语言版本规则主体必须一致。
# 防止 sigma-cli 或后端升级后，文档中的承诺悄然失效。
#
# 八类测试仅需 Docker，ubuntu-latest 已提供。
# sigma-cli、scapy、Suricata、Python 镜像在容器中隔离执行。
# 不向 runner 安装额外依赖，规则与来源源码以只读方式挂载。
# 除 detections 改动外，被指标固定的来源文件变化也触发测试。
# 包括 enrich、selfupdate、guard、db 的 User-Agent、标记和破坏性命令 token。
# 还包括 cmd/artex/main.go 默认端口、traffic.go 的 MITM CA 文件名。
# db/schema_sqlite.sql 探索图 schema 指纹也属于来源契约。
# 源码指纹改变时必须同步规则和指标，不能让资料过期。
# 遇到临时限流可重新运行工作流。
on:
  push:
    # tag 推送不再重复触发：同一个 commit 已经在 main 的 push 上验证过了，
    # tag 再跑一遍纯属重复（界面噪声 + 白耗额度）。tag 只交给 release.yml。
    tags-ignore: ["v*"]
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema_sqlite.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # 内联模板门禁读取这两份防御指南。
      # 模板改变后需重新验证，因此加入触发路径。
      - "docs/04-防御与检测.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema_sqlite.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/04-防御与检测.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# 同一分支出现新 push 时取消前次运行，避免积累无用任务。
# 并发组不改变测试隔离和合并门禁要求。
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 测试 harness 注册表同步（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机 triage 自测（artex_host_triage.py --self-test）
        run: detections/tests/triage-selftest.sh
      - name: 防御指南内联 Sigma 模板检查（check、转换矩阵、双语规则主体一致）
        run: detections/tests/check-defense-template.sh
      - name: Sigma 规则复现（check、后端转换、指标保留）
        run: detections/tests/sigma/run.sh
      - name: Sigma 真实事件匹配（恶意样本触发、正常样本静默）
        run: detections/tests/sigma_match/run.sh
      - name: SigmaHQ 约定验证器与已记录基线
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端可移植性
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 复现（pcap 合成与告警数量断言）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 层与规则一致性
        run: detections/tests/attack/run.sh
      - name: 指标与上游源码一致性
        run: detections/tests/indicators/run.sh
      - name: MISP 导出与 CSV 同步（pymisp 格式验证）
        run: detections/tests/misp/run.sh
