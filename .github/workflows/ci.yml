name: ci
# 日常验证的唯一下口：Go 构建测试、前端构建、检测规则、文档链接、语言检查。
# 此前拆成 ci/web/detections/docs/external-links 五个工作流并行，
# 界面上要分别点开查看，且各自的缓存 key 互不共享导致反复失效。
# 现在合并到单工作流：一屏看全、缓存天然共享、合并门禁一目了然。
#
# release.yml 仅在 v* tag 构建发布包，不承担日常验证。
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC，跑外部链接存活检查
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交取消旧提交，避免重复构建争抢缓存。
# 定时任务单独成组，不会被普通 push 取消。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ---------- Go：构建、静态分析、单元测试 ----------
  # 无数据库环境下依赖数据库的集成测试由 t.Skipf 跳过，
  # 跳过记为通过，不能代替下面的真实数据库测试。
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false # 缓存由下方 actions/cache 统一管理，避免两套 key 互相失效

      # 模块缓存与平台无关，本工作流所有 Go job 共用一份；
      # 编译缓存按 runner 平台区分。actions/cache 在 post 阶段保存，
      # 此时构建已完成，写盘的是真实产物。
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（无数据库，集成测试跳过）
        run: go test ./... -count=1

      # 可下载产物：验证用的 Windows 单二进制（amd64 + arm64）。
      # Linux runner 无法执行 PE，用结构校验代替运行冒烟测试。
      # release.yml 负责打包 zip 与发布。
      - name: 构建验证用 Windows 二进制
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/artex-windows-$arch.exe" ./cmd/artex
          done
      - name: 校验 PE 结构与目标架构
        run: |
          python3 - <<'PY'
          import struct, sys, glob
          for path in sorted(glob.glob("dist/artex-windows-*.exe")):
              data = open(path, "rb").read()
              if data[:2] != b"MZ":
                  sys.exit(f"{path}: 不是 Windows PE（缺少 MZ 头）")
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              if data[pe:pe + 4] != b"PE\0\0":
                  sys.exit(f"{path}: 缺少 PE\\0\\0 签名")
              machine = struct.unpack_from("<H", data, pe + 4)[0]
              want = 0x8664 if "amd64" in path else 0xAA64
              if machine != want:
                  sys.exit(f"{path}: 机器类型 0x{machine:X} 与预期 0x{want:X} 不符")
              print(f"PE 校验通过：{path} machine=0x{machine:X}")
          PY
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: artex-windows-ci
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ---------- Go：真实 PostgreSQL 集成测试 ----------
  # 每个包独立 PostgreSQL 服务，保持空数据库起点；
  # 隔离可避免连接 teardown、重置时的跨包 schema 依赖。
  # 六个 matrix job 并行执行，共享同一份模块缓存；
  # 编译缓存关闭——并行 job 写同一份 GOCACHE 会互相覆盖，纯浪费配额。
  go-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块缓存
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: go test（数据库集成 · ${{ matrix.pkg }} 独立包）
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1

  # ---------- 前端：类型检查、单元测试、静态导出、Biome ----------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - name: npm ci
        run: npm ci
      - name: 前端单元测试（含语言迁移和审批摘要）
        run: npm test
      - name: build:static（合并门禁，含类型检查）
        run: npm run build:static
      - name: 静态 UI 无韩文残留
        run: python3 -I ../scripts/check-language.py --web
      - name: 上传静态导出产物
        uses: actions/upload-artifact@v7
        with:
          name: web-out-ci
          path: web/out/
          retention-days: 14
          if-no-files-found: error
      - name: biome check（lint、format、a11y 错误为零）
        if: always()
        run: npm run check

  # ---------- 检测规则：Sigma / Suricata / ATT&CK / 指标 ----------
  # 验证检测规则可实际编译转换、指标与源码一致、防御指南内联模板有效。
  # 不修改规则却未同步测试基线的改动会在此失败。
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 测试 harness 注册表同步（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机 triage 自测（artex_host_triage.py --self-test）
        run: detections/tests/triage-selftest.sh
      - name: 防御指南内联 Sigma 模板检查（check、转换矩阵、双语规则主体一致）
        run: detections/tests/check-defense-template.sh
      - name: Sigma 规则复现（check、后端转换、指标保留）
        run: detections/tests/sigma/run.sh
      - name: Sigma 真实事件匹配（恶意样本触发、正常样本静默）
        run: detections/tests/sigma_match/run.sh
      - name: SigmaHQ 约定验证器与已记录基线
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端可移植性
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 复现（pcap 合成与告警数量断言）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 层与规则一致性
        run: detections/tests/attack/run.sh
      - name: 指标与上游源码一致性
        run: detections/tests/indicators/run.sh
      - name: MISP 导出与 CSV 同步（pymisp 格式验证）
        run: detections/tests/misp/run.sh

  # ---------- 文档：内部链接、图片与锚点 ----------
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # -I 隔离用户 site-packages，避免本地环境干扰
      - name: 文档内部链接、图片与锚点检查
        run: python3 -I scripts/check-doc-links.py

  # ---------- 语言：源码、注释、词库与文档无韩文残留 ----------
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 源码、注释、词库与文档无韩文残留
        run: python3 -I scripts/check-language.py --source
      - name: 语言检查器回归测试
        run: python3 -I -m unittest discover -s scripts/tests -v

  # ---------- 外部链接：仅在定时与手动触发时运行 ----------
  # 外部 URL 是否存活不取决于本次改动，不作为合并门禁；
  # 远端临时失效导致误报时，由维护者人工核查。
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: 外部链接状态（浏览器 UA、GET、重定向、允许列表，不阻止合并）
        run: python3 -I scripts/check-external-links.py --strict