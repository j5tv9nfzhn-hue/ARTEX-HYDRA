name: ci
# 每次 push、PR 执行构建、静态分析、测试，提前发现中文化回归。
# release.yml 仅在 v* tag 执行发布构建，因此日常改动由本工作流验证。
# 单元测试和数据库集成测试分别运行，语言检查独立覆盖全仓库自有文本。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 同一分支的新提交取消仍在运行的旧提交，避免过期构建占用 runner 并争抢缓存写入。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 无数据库执行构建、静态分析与单元测试，复现 clone 后的本地环境。
  # 未安装 PostgreSQL 时，依赖数据库的集成测试由 t.Skipf 跳过。
  # 跳过会记为通过，不能代替下面的真实数据库测试。
  # go build、go vet 与不依赖数据库的单元测试均需通过。
  # 此组合能发现跨包文案修改与对应断言不一致等回归。
  # 数据库路径由独立 matrix job 检查，避免仅检查常量掩盖问题。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false # 缓存由 go-build-cache 复合动作统一管理，避免两套 key 互相失效
      - name: 恢复 Go 模块与编译缓存
        uses: ./.github/actions/go-build-cache
        with:
          suffix: build
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（无数据库，集成测试跳过）
        run: go test ./... -count=1

      # 构建可下载产物：验证用的 linux/amd64 单二进制与测试日志。
      # release.yml 负责全平台交叉编译与正式发布包，这里只提供可直接
      # 下载核对的 CI 产物，避免验证时只能翻日志。
      - name: 构建验证用二进制
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/artex ./cmd/artex
          dist/artex -h > dist/artex-help.txt 2>&1 || true
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: artex-linux-amd64-ci
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # 使用真实 PostgreSQL 验证通知、证据与用量计量的集成路径。
  # 覆盖无数据库 job 跳过的渠道验证、证据保存和 llm_usage 等路径。
  # 数据库专属语言回归也必须在合并前被发现。
  #
  # 原测试 harness 共享数据库、只建立一次表，并隐式依赖执行顺序。
  # 全部包放入同一数据库可能积累测试数据并出现清理竞争。
  # 因此每个包使用独立 PostgreSQL 服务，保持空数据库起点。
  # 隔离可避免连接 teardown、重置时的跨包 schema 依赖。
  # matrix 每次仅执行一个包，数据、连接与 schema 互不影响。
  # 每个 job 自行完成迁移，不依赖其他包预先创建表。
  # db.Open 自动迁移基础 schema，llm_usage 等额外表由测试创建。
  # EnsureLLMUsageTable 保证计量表存在。
  #
  # 缓存策略：6 个 matrix job 并行执行，共享同一份模块缓存（GOMODCACHE 与平台无关）。
  # 编译缓存关闭：并行 job 写同一份 GOCACHE 会互相覆盖，既无收益又白占配额；
  # 需要编译产物缓存的路径由 go job 与 release 的交叉编译承担。
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: 恢复 Go 模块缓存
        uses: ./.github/actions/go-build-cache
        with:
          cache-build: "false"
      - name: go test（数据库集成 · ${{ matrix.pkg }} 独立包）
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1

  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 源码、注释、词库与文档无韩文残留
        run: python3 -I scripts/check-language.py --source
      - name: 语言检查器回归测试
        run: python3 -I -m unittest discover -s scripts/tests -v