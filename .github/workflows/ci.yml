name: ci
# 日常验证的唯一下口：Go 构建测试、前端构建、检测规则、文档链接、语言检查。
# 此前拆成 ci/web/detections/docs/external-links 五个工作流并行，
# 界面上要分别点开查看，且各自的缓存 key 互不共享导致反复失效。
# 现在合并到单工作流：一屏看全、缓存天然共享、合并门禁一目了然。
#
# release.yml 仅在 v* tag 构建发布包，不承担日常验证。
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC，跑外部链接存活检查
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交取消旧提交，避免重复构建争抢缓存。
# 定时任务单独成组，不会被普通 push 取消。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ---------- Go：构建、静态分析、单元测试 ----------
  # 无数据库环境下依赖数据库的集成测试由 t.Skipf 跳过，
  # 跳过记为通过，不能代替下面的真实数据库测试。
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false # 缓存由下方 actions/cache 统一管理，避免两套 key 互相失效

      # 模块缓存与平台无关，本工作流所有 Go job 共用一份；
      # 编译缓存按 runner 平台区分。actions/cache 在 post 阶段保存，
      # 此时构建已完成，写盘的是真实产物。
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # 产物需要内嵌前端，因此本 job 自行构建静态资源。
      # 不复用 web job 的 artifact：让 go 与 web 保持独立，
      # 任意一方失败都不掩盖另一方的结果；npm 与 Next 缓存已共享，重复成本很低。
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - name: 构建前端静态资源并同步到内嵌目录
        working-directory: web
        run: |
          npm ci
          npm run build:static
      - name: 同步 web/out 到 server/webui/dist（避免嵌套 out/out）
        run: |
          rm -rf server/webui/dist
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/
          test -f server/webui/dist/index.html || { echo "内嵌目录缺少 index.html"; exit 1; }

      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # 内嵌前端路径只在 -tags embedui 下参与编译，默认构建覆盖不到。
      # 单独 vet 一次，确保 embedui 分支不会因为长期不构建而悄悄腐化。
      # 注意不把它加到下面的 go test 上：webui_stub_localized_test.go
      # 带 !embedui 约束，加了 tag 等于把这个测试静默跳过。
      - name: go vet（含内嵌前端）
        run: go vet -tags embedui ./server/
      # 格式门禁：gofmt -l 输出任何文件即失败。此前仓库没有这一道，
      # 未格式化的提交只能靠 reviewer 肉眼发现。
      - name: gofmt 门禁
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt（请运行 gofmt -w <文件>）："
            echo "$unformatted"
            exit 1
          fi
      # 静态检查门禁：配置见 .golangci.yml（保守基线 govet，之后逐项收紧）。
      # 格式不在此重复检查：golangci-lint 的 gofmt 内嵌其构建时的 Go 版本
      # （v2.14.0 = go1.27），与上面 gofmt 门禁的 1.26 可能判定相反。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m
      # SQLite 无需服务容器，且每个包的 TestMain 都指向自己的临时库文件，
      # 所以这一条就是完整的真实执行：不再有「因连不上数据库而静默跳过」的用例。
      - name: go test（含数据库集成，全部真实执行）
        run: go test ./... -count=1 -timeout 600s

      # 可下载产物：三端发布包 zip（linux/darwin/windows × amd64/arm64），与
      # release.yml 走同一个 build.sh——内嵌前端（-tags embedui）、start 脚本、
      # skills 与 config.example.json，版本号默认取提交短 sha。runner 不执行
      # 非宿主平台二进制，用文件头结构校验代替冒烟测试；正式发布见 release.yml。
      - name: 构建三端发布包（复用 build.sh）
        env:
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # 与 release 一致：Go linker 去符号 + zip 压缩，不用 UPX。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: ./build.sh --release
      - name: 校验可执行文件头与目标架构
        run: python3 -I scripts/check-binary-headers.py linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
      - name: 上传构建产物（Linux 双架构）
        uses: actions/upload-artifact@v7
        with:
          name: artex-linux-ci
          path: "dist/*-linux-*.zip"
          retention-days: 14
          if-no-files-found: error
      - name: 上传构建产物（macOS 双架构）
        uses: actions/upload-artifact@v7
        with:
          name: artex-darwin-ci
          path: "dist/*-darwin-*.zip"
          retention-days: 14
          if-no-files-found: error
      - name: 上传构建产物（Windows 双架构）
        uses: actions/upload-artifact@v7
        with:
          name: artex-windows-ci
          path: "dist/*-windows-*.zip"
          retention-days: 14
          if-no-files-found: error


  # ---------- 前端：类型检查、单元测试、静态导出、Biome ----------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 恢复 npm 与 Next.js 构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            web/.next/cache
            web/node_modules/.cache
          key: node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - name: npm ci
        run: npm ci
      - name: 前端单元测试（含语言迁移和审批摘要）
        run: npm test
      - name: build:static（合并门禁，含类型检查）
        run: npm run build:static
      - name: 静态 UI 无韩文残留
        run: python3 -I ../scripts/check-language.py --web
      - name: 上传静态导出产物
        uses: actions/upload-artifact@v7
        with:
          name: web-out-ci
          path: web/out/
          retention-days: 14
          if-no-files-found: error
      - name: biome check（lint、format、a11y 错误为零）
        if: always()
        run: npm run check

  # ---------- 检测规则：Sigma / Suricata / ATT&CK / 指标 ----------
  # 验证检测规则可实际编译转换、指标与源码一致、防御指南内联模板有效。
  # 不修改规则却未同步测试基线的改动会在此失败。
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 测试 harness 注册表同步（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机 triage 自测（artex_host_triage.py --self-test）
        run: detections/tests/triage-selftest.sh
      - name: 防御指南内联 Sigma 模板检查（check、转换矩阵、双语规则主体一致）
        run: detections/tests/check-defense-template.sh
      - name: Sigma 规则复现（check、后端转换、指标保留）
        run: detections/tests/sigma/run.sh
      - name: Sigma 真实事件匹配（恶意样本触发、正常样本静默）
        run: detections/tests/sigma_match/run.sh
      - name: SigmaHQ 约定验证器与已记录基线
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端可移植性
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 复现（pcap 合成与告警数量断言）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 层与规则一致性
        run: detections/tests/attack/run.sh
      - name: 指标与上游源码一致性
        run: detections/tests/indicators/run.sh
      - name: MISP 导出与 CSV 同步（pymisp 格式验证）
        run: detections/tests/misp/run.sh

  # ---------- 文档：内部链接、图片与锚点 ----------
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # -I 隔离用户 site-packages，避免本地环境干扰
      - name: 文档内部链接、图片与锚点检查
        run: python3 -I scripts/check-doc-links.py

  # ---------- 语言：源码、注释、词库与文档无韩文残留 ----------
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 源码、注释、词库与文档无韩文残留
        run: python3 -I scripts/check-language.py --source
      - name: 语言检查器回归测试
        run: python3 -I -m unittest discover -s scripts/tests -v

  # ---------- 外部链接：仅在定时与手动触发时运行 ----------
  # 外部 URL 是否存活不取决于本次改动，不作为合并门禁；
  # 远端临时失效导致误报时，由维护者人工核查。
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: 外部链接状态（浏览器 UA、GET、重定向、允许列表，不阻止合并）
        run: python3 -I scripts/check-external-links.py --strict