name: docs
# 每次 push、PR 检查 Markdown 内部链接和图片目标存在。
# 同时检查 #标题 锚点对应目标文档的真实标题。
# 防止损坏的文件、图片或锚点引用进入主分支。
# 被引用文件可能位于仓库任何目录，因此不设置 paths 过滤。
# 外部 http、https、mailto 依赖网络状态，不属于确定性合并门禁。
# check-doc-links.py 仅检查内部引用。
# 脚本只使用 Python 标准库，不连接网络。
# 因此不会受 Docker Hub 或远端限流影响。
# Go 检查由 ci.yml、检测规则由 detections.yml、中文 UI 由 web.yml 负责。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 同一分支的新 push 取消前次运行，避免重复任务。
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest 已安装 python3，脚本只依赖标准库。
      # 无需安装依赖，以 -I 隔离用户 site-packages 和环境。
      # 内部引用检查保持确定性。
      - name: 文档内部链接、图片与锚点检查
        run: python3 -I scripts/check-doc-links.py
