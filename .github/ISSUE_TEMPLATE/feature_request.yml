name: 💡 功能建议
description: 提议新功能或改进方案。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提供建议。填写以下信息有助于明确改进方向。
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索是否存在相同建议。
          required: true
        - label: 本建议不鼓励超出授权范围或违反适用法律的行为。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题
      description: 请先描述具体场景和需求，再说明解决方案。
      placeholder: "例如：希望将检测报告导出为 PDF，与团队共享。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明你希望如何解决问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如考虑过其他方式，请一并说明。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - Agent（agent）
        - Web UI / 服务器（web / server）
        - LLM 供应商集成
        - 文档与翻译
        - 其他
    validations:
      required: false
