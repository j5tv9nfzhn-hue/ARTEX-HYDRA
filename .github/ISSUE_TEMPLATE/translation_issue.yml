name: 🌐 翻译与本地化问题
description: 报告简体中文翻译不自然、错误或遗漏的问题。
title: "[翻译] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进简体中文版。
        本地化原则是将项目自有韩文文案、注释和说明统一为简体中文，同时保留命令、payload、协议字段、工具名和原始证据的技术内容。
        详细原则见 [CONTRIBUTING.md](https://github.com/j5tv9nfzhn-hue/ARTEX/blob/main/CONTRIBUTING.md#本地化原则)。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 翻译不自然或不通顺
        - 翻译错误或含义改变
        - 翻译遗漏，仍有韩文
        - 不应翻译的命令、代码、日志等被改写
        - 术语需要统一
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 出现位置
      options:
        - Web UI
        - Agent 产物（发现、摘要、报告、对话）
        - 文档（如 README）
        - 其他
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前文案
      description: 请粘贴当前文本，并说明页面及触发场景。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议文案
      description: 可选，说明你认为如何修改更合适。
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: 消息键或文件位置
      description: 如已知，请填写 web/messages/zh.json 的消息键或源码位置。
      placeholder: "例如：web/messages/zh.json → dashboard.title"
    validations:
      required: false
