name: 🐛 缺陷报告
description: 报告与预期不符的行为或错误。
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。填写以下信息有助于复现与修复。
        **安全漏洞请通过 [SECURITY.md](https://github.com/j5tv9nfzhn-hue/ARTEX/blob/main/SECURITY.md) 的私密渠道报告，不要使用公开缺陷模板。**
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索是否存在相同问题。
          required: true
        - label: 问题在自有、明确授权的目标或本地隔离环境中复现。
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 请同时说明预期行为与实际行为。
      placeholder: "例如：结果应为简体中文，却仍显示韩文。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按顺序列出可重复复现问题的步骤。
      placeholder: |
        1. 打开 '...' 页面
        2. 执行 '...'
        3. 在 '...' 发生错误
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请提供相关日志或截图，并隐藏 API Key、token、目标地址等敏感内容。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: 相关模块
      description: 请选择发生问题的组件。
      options:
        - Agent（agent）
        - Web UI / 服务器（web / server）
        - 安装与部署（Docker、脚本）
        - LLM 供应商集成
        - 文档与翻译
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写发布 tag 或提交哈希。
      placeholder: "例如：v2.2.0 或 b45ba04"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请说明 OS、是否使用 Docker、LLM 模型等。
      placeholder: "例如：macOS 15 / Docker Compose / claude-opus-4-8"
    validations:
      required: false
