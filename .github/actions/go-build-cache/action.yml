name: "Go 构建缓存"
description: >
  统一 Go 模块缓存与编译缓存的 key 生成，供 ci.yml 与 release.yml 共用。
  同一套 key 表达式是跨工作流共享缓存的前提：任何工作流保存的条目，
  其他工作流都能用同样的 restore-keys 前缀命中，避免每个工作流各存一份。

inputs:
  os:
    description: "构建目标的 GOOS（默认取 runner 系统）"
    required: false
    default: ""
  arch:
    description: "构建目标的 GOARCH（默认取 runner 系统）"
    required: false
    default: ""
  suffix:
    description: "附加到编译缓存 key 的区分后缀，用于同一目标下不同 job 的隔离"
    required: false
    default: "shared"
  cache-build:
    description: "是否缓存编译产物（GOCACHE）。并行 matrix 建议关闭，避免互相覆盖并节省配额"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: 解析构建目标
      id: target
      shell: bash
      run: |
        os="${{ inputs.os }}"
        arch="${{ inputs.arch }}"
        [ -n "$os" ] || os="${{ runner.os }}"
        [ -n "$arch" ] || arch="${{ runner.arch }}"
        echo "os=$os" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"

    # ---- 模块缓存：与平台无关，所有工作流、所有构建目标共用一份 ----
    - name: 恢复 Go 模块缓存
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.tool_cache }}/go-mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-
          gomod-

    # ---- 编译缓存：与目标平台绑定，按 os/arch/suffix 区分 ----
    - name: 恢复 Go 编译缓存
      if: inputs.cache-build == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.tool_cache }}/go-build
        key: gobuild-${{ steps.target.outputs.os }}-${{ steps.target.outputs.arch }}-${{ inputs.suffix }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          gobuild-${{ steps.target.outputs.os }}-${{ steps.target.outputs.arch }}-${{ inputs.suffix }}-
          gobuild-${{ steps.target.outputs.os }}-${{ steps.target.outputs.arch }}-

    - name: 导出缓存目录环境变量
      shell: bash
      run: |
        echo "GOMODCACHE=${{ runner.tool_cache }}/go-mod" >> "$GITHUB_ENV"
        echo "GOCACHE=${{ runner.tool_cache }}/go-build" >> "$GITHUB_ENV"
        echo "GOFLAGS=-buildvcs=false" >> "$GITHUB_ENV"

    - name: 预热模块缓存
      shell: bash
      run: go mod download

    - name: 保存 Go 模块缓存
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.tool_cache }}/go-mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

    - name: 保存 Go 编译缓存
      if: always() && inputs.cache-build == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.tool_cache }}/go-build
        key: gobuild-${{ steps.target.outputs.os }}-${{ steps.target.outputs.arch }}-${{ inputs.suffix }}-${{ hashFiles('go.sum') }}